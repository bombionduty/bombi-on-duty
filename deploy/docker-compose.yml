# Runs Bombi On Duty + Caddy (free auto-HTTPS) on your Droplet.
# Caddy gets a free Let's Encrypt certificate for your ${DOMAIN} (a nip.io
# hostname built from the Droplet IP) and forwards traffic to the bot.
#
# Start with:  docker compose -f deploy/docker-compose.yml up -d --build
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: ../.env
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      # Persist uploaded evidence (photos/screenshots) across redeploys.
      - app_data:/app/data
    # Unique network alias so Caddy routes ONLY to this container. Another app on
    # the same Docker network that also uses the service name "app" (e.g. the
    # Zite inventory app) would otherwise collide and cause round-robin 404s.
    networks:
      default:
        aliases:
          - bombionduty-app
    # Surfaces a frozen/unresponsive app as "unhealthy" in `docker ps` (the
    # watchdog cron is what actually restarts it).
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=5).status==200 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
      - PACK_DOMAIN=${PACK_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
  app_data:
